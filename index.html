<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBONARIUM • economy.signal</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:radial-gradient(circle at center,#111 0%,#000 70%);
  color:#d0d0d0;
  font-family:"Courier New",monospace;
}

#wrap{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* ===== TICKER ===== */
#ticker{
  position:fixed;
  bottom:0;
  width:100%;
  overflow:hidden;
  background:#000;
  border-top:1px solid #111;
}

#ticker span{
  display:inline-block;
  white-space:nowrap;
  padding-left:100%;
  animation:ticker 40s linear infinite;
  font-size:13px;
}

@keyframes ticker{
  from{transform:translateX(0);}
  to{transform:translateX(-100%);}
}

/* ===== CONTENT ===== */
.section{
  text-align:center;
  margin:18px 0;
  opacity:0;
  animation:fadeIn 1.4s forwards;
}

.section:nth-child(2){animation-delay:.4s}
.section:nth-child(3){animation-delay:.8s}
.section:nth-child(4){animation-delay:1.2s}

@keyframes fadeIn{
  to{opacity:1}
}

h2{
  font-size:13px;
  color:#777;
  margin-bottom:6px;
  font-weight:normal;
}

.data div{
  font-size:15px;
  line-height:1.7;
}

.up{color:#6f6}
.down{color:#f66}

/* ===== CHART ===== */
#chart{
  width:92vw;
  max-width:720px;
  height:360px;
  margin:30px 0;
  border:1px solid #111;
}
</style>
</head>

<body>
<div id="wrap">

  <div class="section">
    <h2>UAH / FX</h2>
    <div id="fx" class="data">loading...</div>
  </div>

  <div class="section">
    <h2>METALS / USD (oz)</h2>
    <div id="metals" class="data">loading...</div>
  </div>

  <div class="section">
    <h2>CRYPTO / USD (24h)</h2>
    <div id="crypto" class="data">loading...</div>
  </div>

  <div id="chart"></div>
</div>

<div id="ticker"><span id="tickerText">loading...</span></div>

<script>
/* ================= FX NBU ================= */
async function loadFX(){
  const r=await fetch("https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json");
  const d=await r.json();
  const f=d.filter(x=>["USD","EUR","PLN"].includes(x.cc));
  fx.innerHTML=f.map(x=>`<div>${x.cc} ${x.rate.toFixed(2)} UAH</div>`).join("");
}

/* ================= METALS ================= */
const METALS_KEY="PASTE_YOUR_METALS_API_KEY";

async function loadMetals(){
  try{
    const r=await fetch(`https://metals-api.com/api/latest?access_key=${METALS_KEY}&base=USD&symbols=XAU,XAG,XPT,XPD`);
    const d=await r.json();
    metals.innerHTML=`
      <div>XAU ${d.rates.XAU.toFixed(2)} USD</div>
      <div>XAG ${d.rates.XAG.toFixed(2)} USD</div>
      <div>XPT ${d.rates.XPT.toFixed(2)} USD</div>
      <div>XPD ${d.rates.XPD.toFixed(2)} USD</div>`;
  }catch{
    metals.innerHTML="<div>NO DATA</div>";
  }
}

/* ================= CRYPTO ================= */
async function loadCrypto(){
  const r=await fetch(
    "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum,solana,litecoin,ripple,dash"
  );
  const d=await r.json();

  crypto.innerHTML=d.map(c=>{
    const cls=c.price_change_percentage_24h>=0?"up":"down";
    const sign=c.price_change_percentage_24h>=0?"+":"";
    return `<div>${c.symbol.toUpperCase()} ${c.current_price} USD <span class="${cls}">${sign}${c.price_change_percentage_24h.toFixed(2)}%</span></div>`;
  }).join("");

  tickerText.innerText=d.map(c=>
    `${c.symbol.toUpperCase()} ${c.current_price} USD (${c.price_change_percentage_24h.toFixed(2)}%)`
  ).join(" • ");
}

/* ================= START ================= */
loadFX();
loadMetals();
loadCrypto();

setInterval(loadFX,60000);
setInterval(loadMetals,300000);
setInterval(loadCrypto,60000);
</script>

<!-- ================= TRADINGVIEW ================= -->
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
  container_id:"chart",
  autosize:true,
  symbol:"BTCUSD",
  interval:"60",
  timezone:"Europe/Kiev",
  theme:"dark",
  style:"1",
  locale:"en",
  hide_top_toolbar:true,
  hide_side_toolbar:true,
  allow_symbol_change:true
});
</script>

</body>
</html>
