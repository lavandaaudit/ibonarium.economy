<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBONARIUM • economy.signal</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:radial-gradient(circle at center,#111 0%,#000 70%);
  color:#d0d0d0;
  font-family:"Courier New",monospace;
}

#wrap{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* ===== TICKER ===== */
#ticker{
  position:fixed;
  bottom:0;
  width:100%;
  overflow:hidden;
  background:#000;
  border-top:1px solid #111;
}

#ticker span{
  display:inline-block;
  white-space:nowrap;
  padding-left:100%;
  animation:ticker 40s linear infinite;
  font-size:13px;
}

@keyframes ticker{
  from{transform:translateX(0);}
  to{transform:translateX(-100%);}
}

/* ===== CONTENT ===== */
.section{
  text-align:center;
  margin:18px 0;
  opacity:0;
  animation:fadeIn 1.4s forwards;
}

.section:nth-child(2){animation-delay:.4s}
.section:nth-child(3){animation-delay:.8s}
.section:nth-child(4){animation-delay:1.2s}

@keyframes fadeIn{
  to{opacity:1}
}

h2{
  font-size:13px;
  color:#777;
  margin-bottom:6px;
  font-weight:normal;
}

.data div{
  font-size:15px;
  line-height:1.7;
}

.up{color:#6f6}
.down{color:#f66}

/* ===== CHART ===== */
#chart{
  width:92vw;
  max-width:720px;
  height:360px;
  margin:30px 0;
  border:1px solid #111;
}
</style>
</head>

<body>
<div id="wrap">

  <div class="section">
    <h2>UAH / FX</h2>
    <div id="fx" class="data">loading...</div>
  </div>

  <div class="section">
    <h2>METALS / USD (1oz)</h2>
    <div id="metals" class="data">loading...</div>
  </div>

  <div class="section">
    <h2>CRYPTO / USD (24h)</h2>
    <div id="crypto" class="data">loading...</div>
  </div>

  <div id="chart"></div>
</div>

<div id="ticker"><span id="tickerText">loading...</span></div>

<script>
/* ================= FX NBU ================= */
async function loadFX(){
  try{
    const r=await fetch("https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json");
    const d=await r.json();
    const f=d.filter(x=>["USD","EUR","PLN"].includes(x.cc));
    fx.innerHTML=f.map(x=>`<div>${x.cc} ${x.rate.toFixed(2)} UAH</div>`).join("");
  }catch{
    fx.innerHTML="<div>NO DATA</div>";
  }
}

/* ================= METALS ================= */
async function loadMetals(){
  try{
    // Приблизні спотові ціни в USD/унція
    const metalsData = [
      {symbol:"XAU",price:4300},
      {symbol:"XAG",price:73},
      {symbol:"XPT",price:2150},
      {symbol:"XPD",price:1620}
    ];
    metals.innerHTML=metalsData.map(m=>`<div>${m.symbol} ${m.price.toFixed(2)} USD</div>`).join("");
  }catch{
    metals.innerHTML="<div>NO DATA</div>";
  }
}

/* ================= CRYPTO ================= */
async function loadCrypto(){
  try{
    const r=await fetch(
      "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,litecoin,ripple,dash&vs_currencies=usd&include_24hr_change=true"
    );
    const d=await r.json();

    const coins = [
      {id:"bitcoin", symbol:"BTC"},
      {id:"ethereum", symbol:"ETH"},
      {id:"solana", symbol:"SOL"},
      {id:"litecoin", symbol:"LTC"},
      {id:"ripple", symbol:"XRP"},
      {id:"dash", symbol:"DASH"}
    ];

    crypto.innerHTML = coins.map(c=>{
      const price = d[c.id].usd.toFixed(2);
      const change = d[c.id].usd_24h_change.toFixed(2);
      const cls = change>=0 ? "up":"down";
      const sign = change>=0 ? "+":"";
      return `<div>${c.symbol} ${price} USD <span class="${cls}">${sign}${change}%</span></div>`;
    }).join("");

    // ticker
    tickerText.innerText = coins.map(c=>{
      const price = d[c.id].usd.toFixed(2);
      const change = d[c.id].usd_24h_change.toFixed(2);
      return `${c.symbol} ${price} USD (${change}%)`;
    }).join(" • ");

  }catch{
    crypto.innerHTML="<div>NO DATA</div>";
    tickerText.innerText="CRYPTO SIGNAL LOST";
  }
}

/* ================= START ================= */
loadFX();
loadMetals();
loadCrypto();
setInterval(loadFX,60000);
setInterval(loadMetals,300000);
setInterval(loadCrypto,60000);

</script>

<!-- ================= TRADINGVIEW ================= -->
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
  container_id:"chart",
  autosize:true,
  symbol:"BTCUSD",
  interval:"60",
  timezone:"Europe/Kiev",
  theme:"dark",
  style:"1",
  locale:"en",
  hide_top_toolbar:true,
  hide_side_toolbar:true,
  allow_symbol_change:true
});
</script>

</body>
</html>
