<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBONARIUM • economy.signal</title>

<style>
html, body {
  margin:0;
  padding:0;
  background: radial-gradient(circle at center,#111 0%,#000 70%);
  color:#d0d0d0;
  font-family:"Courier New", monospace;
}

#wrap {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* ===== TICKER ===== */
#ticker {
  width:100%;
  overflow:hidden;
  background:#000;
  border-top:1px solid #111;
  padding:4px 0;
  position:fixed;
  bottom:0;
}

#ticker span {
  display:inline-block;
  white-space:nowrap;
  padding-left:100%;
  animation: ticker 40s linear infinite;
  font-size:13px;
}

@keyframes ticker {
  from {transform:translateX(0);}
  to {transform:translateX(-100%);}
}

/* ===== CONTENT ===== */
.section {
  text-align:center;
  margin:18px 0;
}

h2 {
  font-size:13px;
  color:#777;
  margin-bottom:6px;
  font-weight: normal;
}

.data div {
  font-size:15px;
  line-height:1.7;
}

/* ===== CHARTS ===== */
.chart {
  width:92vw;
  max-width:720px;
  height:360px;
  margin:20px 0;
  border:1px solid #111;
}
</style>
</head>

<body>
<div id="wrap">

  <div class="section">
    <h2>UAH / FX</h2>
    <div id="fx" class="data">loading...</div>
  </div>

  <div class="section">
    <h2>METALS / USD (1oz)</h2>
    <div id="metals" class="data">loading...</div>
  </div>

  <div id="chartBTC" class="chart"></div>
  <div id="chartETH" class="chart"></div>
  <div id="chartSOL" class="chart"></div>
  <div id="chartXRP" class="chart"></div>
  <div id="chartLTC" class="chart"></div>
  <div id="chartDASH" class="chart"></div>

</div>

<div id="ticker"><span id="tickerText">LOADING TICKER...</span></div>

<script>
/* ================= FX NBU ================= */
async function loadFX(){
  try{
    const r = await fetch("https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json");
    const d = await r.json();
    const f = d.filter(x => ["USD","EUR","PLN"].includes(x.cc));
    fx.innerHTML = f.map(x => `<div>${x.cc} ${x.rate.toFixed(2)} UAH</div>`).join("");
  }catch{
    fx.innerHTML="<div>NO DATA</div>";
  }
}

/* ================= METALS ================= */
async function loadMetals(){
  try{
    const metalsData = [
      {symbol:"XAU",price:4300},
      {symbol:"XAG",price:73},
      {symbol:"XPT",price:2150},
      {symbol:"XPD",price:1620}
    ];
    metals.innerHTML = metalsData.map(m => `<div>${m.symbol} ${m.price.toFixed(2)} USD</div>`).join("");
  }catch{
    metals.innerHTML="<div>NO DATA</div>";
  }
}

/* ================= TICKER ================= */
function startTicker(){
  tickerText.innerText = "IBONARIUM ECONOMY SIGNAL • FX & METALS LIVE • BTC ETH SOL XRP LTC DASH";
}

/* ================= START ================= */
loadFX();
loadMetals();
startTicker();
setInterval(loadFX,60000);
setInterval(loadMetals,300000);
</script>

<!-- ================= TRADINGVIEW ================= -->
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
function createTradingView(container, symbol){
  new TradingView.widget({
    container_id: container,
    autosize: true,
    symbol: symbol,
    interval: "60",
    timezone: "Europe/Kiev",
    theme: "dark",
    style: "1",
    locale: "en",
    hide_top_toolbar:true,
    hide_side_toolbar:true,
    allow_symbol_change:true
  });
}

createTradingView("chartBTC","BTCUSD");
createTradingView("chartETH","ETHUSD");
createTradingView("chartSOL","SOLUSD");
createTradingView("chartXRP","XRPUSD");
createTradingView("chartLTC","LTCUSD");
createTradingView("chartDASH","DASHUSD");
</script>

</body>
</html>
