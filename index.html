<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECONOMIC SIGNAL</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap');

body {
  margin: 0;
  background: black;
  color: #cfd8dc;
  font-family: 'JetBrains Mono', monospace;
  overflow: hidden;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: -1;
}

/* ===== ЦЕНТР ===== */
.center {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.stack {
  text-align: center;
  font-size: 13px;
  line-height: 1.6;
}

.sep {
  opacity: .3;
  margin: 8px 0;
}

/* ===== TICKER ===== */
.ticker {
  position: fixed;
  bottom: 18px;
  width: 100%;
  overflow: hidden;
  white-space: nowrap;
  font-size: 12px;
  opacity: .85;
}

.ticker span {
  display: inline-block;
  padding-left: 100%;
  animation: scroll 30s linear infinite;
}

@keyframes scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-100%); }
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="center">
  <div class="stack">
    <div id="fx">loading…</div>
    <div class="sep">────────────</div>
    <div id="metals">loading…</div>
  </div>
</div>

<div class="ticker">
  <span id="cryptoTicker">CRYPTO SIGNAL LOADING…</span>
</div>

<script>
/* ===== STARFIELD ===== */
const c = document.getElementById('stars');
const x = c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight;}
resize(); onresize=resize;
const stars=[...Array(140)].map(()=>({x:Math.random()*c.width,y:Math.random()*c.height,z:Math.random()*2}));
(function draw(){
  x.clearRect(0,0,c.width,c.height);
  stars.forEach(s=>{
    s.y+=s.z;
    if(s.y>c.height) s.y=0;
    x.globalAlpha=s.z/2;
    x.fillStyle='white';
    x.fillRect(s.x,s.y,1,1);
  });
  requestAnimationFrame(draw);
})();

/* ===== NBU ===== */
async function loadNBU(){
  const r = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json');
  const d = await r.json();

  fx.innerHTML = '';
  metals.innerHTML = '';

  d.forEach(i=>{
    if(['USD','EUR','GBP','PLN'].includes(i.cc))
      fx.innerHTML += `<div>${i.cc} ${i.rate.toFixed(2)} UAH</div>`;

    if(['XAU','XAG','XPT','XPD'].includes(i.cc))
      metals.innerHTML += `<div>${i.cc} ${i.rate.toFixed(2)} USD</div>`;
  });
}

/* ===== CRYPTO TICKER (BINANCE) ===== */
const symbols = [
  'BTCUSDT','ETHUSDT','SOLUSDT','LTCUSDT','XRPUSDT','DASHUSDT'
];

async function loadCryptoTicker(){
  try {
    const r = await fetch('https://api.binance.com/api/v3/ticker/price');
    const d = await r.json();

    const filtered = d.filter(i => symbols.includes(i.symbol));

    const text = filtered
      .map(i => `${i.symbol.replace('USDT','')} ${Number(i.price).toFixed(2)} USD`)
      .join('   •   ');

    cryptoTicker.textContent = text + '   •   ';
  } catch {
    cryptoTicker.textContent = 'CRYPTO SIGNAL LOST';
  }
}

/* ===== INIT ===== */
loadNBU();
loadCryptoTicker();

setInterval(loadCryptoTicker, 30000);
</script>

</body>
</html>
