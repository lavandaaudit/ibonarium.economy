<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ibonarium•cripto.signal.live</title>

<!-- Підключаємо шрифти Cinzel та Space Grotesk -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">

<style>
* {margin:0; padding:0; box-sizing:border-box;}
html, body {
  width:100%; height:100%; 
  background:#000; 
  font-family:'Space Grotesk', sans-serif; 
  color:#9fe7ff; 
  overflow-x:hidden;
}
canvas {position:fixed; inset:0; z-index:0;}
.wrapper {
  position:relative; z-index:2; 
  display:flex; flex-direction:column; 
  align-items:center; 
  padding:20px; gap:6px; 
  text-align:center; 
  font-size:13px; line-height:1.3;
}

/* ===== HEADER ===== */
#header-title {
  font-family:'Cinzel', serif; 
  font-size:22px; 
  font-weight:bold; 
  margin-bottom:10px;
}

/* ===== SECTIONS ===== */
.section {width:90%; max-width:720px; margin:4px 0; display:flex; flex-wrap:wrap; justify-content:space-between;}
.section div {margin:2px 6px; font-size:11px; line-height:1.0; font-family:'Space Grotesk', sans-serif;}

/* ===== TICKER ===== */
#ticker {width:100%; overflow:hidden; background:#1a001a; border-top:1px solid #111; border-bottom:1px solid #111; padding:4px 0; position:relative;}
#ticker span {display:inline-block; white-space:nowrap; padding-left:100%; animation: ticker 60s linear infinite; font-size:13px; font-family:'Space Grotesk', sans-serif;}
@keyframes ticker {from{transform:translateX(0);} to{transform:translateX(-100%);}}

/* ===== ALERTS ===== */
#alerts {width:90%; max-width:720px; padding:8px; margin:12px 0; text-align:center; font-size:13px; line-height:1.3; position:relative;}
.alert {
  display:inline-block;
  margin:2px 4px;
  font-family:'Space Grotesk', sans-serif;
  font-size:14px;
  opacity:0.9;
  font-weight:bold;
  transition:opacity 1s;
}
.alert.up {color:#00ff00;}
.alert.down {color:#ff0000;}
.alert.extreme {color:#ff3300;}
.alert.normal {color:#ffff00;}

/* ===== SYSTEM STATE ===== */
#systemStateContainer {
  display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:12px 0; font-family:'Cinzel', serif; font-size:16px;
}
.systemIndicator {
  min-width:120px; text-align:center; font-weight:bold; padding:4px 0; border-radius:12px; transition:all 0.5s; 
}
.systemIndicator.extremeFear {color:#ff0000;}
.systemIndicator.fear {color:#ff6600;}
.systemIndicator.greed {color:#00ff00;}
.systemIndicator.normal {color:#ffff00;}
.systemIndicator.state1 {color:#00ffff;}
.systemIndicator.state2 {color:#ff00ff;}
.systemIndicator.state3 {color:#ffaa00;}
.systemIndicator.state4 {color:#ff99ff;}
.systemIndicator.state5 {color:#66ff66;}
.systemIndicator.state6 {color:#66ccff;}
.systemIndicator.state7 {color:#ff6666;}
.systemIndicator.state8 {color:#9999ff;}

/* ===== ANALYTICS & CHARTS ===== */
#analytics {width:90%; max-width:720px; text-align:left; font-size:11px; line-height:1.2; margin:10px 0; border-top:1px solid #111; border-bottom:1px solid #111; padding:6px 4px; display:flex; flex-direction:column; gap:2px; font-family:'Space Grotesk', sans-serif;}
.chart {width:92vw; max-width:720px; height:320px; margin:14px 0; border:1px solid #111;}
#footer {font-size:10px; opacity:0.4; margin:12px 0; font-family:'Space Grotesk', sans-serif;}
@media(max-width:600px){.chart{height:240px;}}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="wrapper">
  <div id="header-title">IBONARIUM • ECONOMY SIGNAL</div>

  <div id="ticker"><span id="tickerText">LOADING CRYPTO DATA...</span></div>

  <div class="section" id="fx"></div>
  <div class="section" id="metals"></div>

  <!-- SYSTEM STATE -->
  <div id="systemStateContainer">
    <div id="systemState" class="systemIndicator normal">Норма</div>
    <div class="systemIndicator state1">Індикатор 1</div>
    <div class="systemIndicator state2">Індикатор 2</div>
    <div class="systemIndicator state3">Індикатор 3</div>
    <div class="systemIndicator state4">Індикатор 4</div>
    <div class="systemIndicator state5">Індикатор 5</div>
    <div class="systemIndicator state6">Індикатор 6</div>
    <div class="systemIndicator state7">Індикатор 7</div>
    <div class="systemIndicator state8">Індикатор 8</div>
  </div>

  <div id="alerts"></div>

  <div id="analytics"></div>

  <div id="chartBTC" class="chart"></div>
  <div id="chartETH" class="chart"></div>
  <div id="chartSOL" class="chart"></div>
  <div id="chartXRP" class="chart"></div>
  <div id="chartLTC" class="chart"></div>
  <div id="chartDASH" class="chart"></div>

  <div id="footer">© IBONARIUM • last update: <span id="lastUpdate"></span></div>
</div>

<script>
// ================= STARS BACKGROUND =================
const s=document.getElementById("stars"); const ctx=s.getContext("2d");
let W,H,stars=[];
function resize(){W=s.width=innerWidth; H=s.height=innerHeight; stars=Array.from({length:160},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*W}));}
resize(); window.addEventListener("resize",resize);
function draw(){ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#9fe7ff"; stars.forEach(st=>{st.z-=0.2; if(st.z<=0) st.z=W; const k=128/st.z; const x=(st.x-W/2)*k+W/2; const y=(st.y-H/2)*k+H/2; if(x>0&&x<W&&y>0&&y<H){const size=(1-st.z/W)*2; ctx.fillRect(x,y,size,size);}}); requestAnimationFrame(draw);}
draw();

// ================= FX & Metals =================
async function loadFX(){
  try{
    const res = await fetch('https://open.er-api.com/v6/latest/USD');
    const fx = await res.json();
    if(fx.result==="success"){
      document.getElementById("fx").innerHTML = `
        <div>1 USD = ${(fx.rates.UAH).toFixed(2)} UAH</div>
        <div>1 EUR = ${(fx.rates.UAH / fx.rates.EUR).toFixed(2)} UAH</div>
        <div>1 PLN = ${(fx.rates.UAH / fx.rates.PLN).toFixed(2)} UAH</div>
        <div>1 GBP = ${(fx.rates.UAH / fx.rates.GBP).toFixed(2)} UAH</div>
      `;
    }else{throw new Error("FX API failed");}
  }catch(err){console.log(err); document.getElementById("fx").innerHTML="FX data unavailable";}
}
function loadMetals(){document.getElementById("metals").innerHTML='<div>XAU 4300</div><div>XAG 73</div><div>XPT 2150</div><div>XPD 1620</div>';}
loadFX(); loadMetals();
setInterval(loadFX,300000);

// ================= CRYPTO & ANALYTICS & ALERTS =================
async function loadCrypto(){
  try{
    const symbols = ["BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","LTCUSDT","DASHUSDT"];
    const promises = symbols.map(sym => fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${sym}`).then(res=>res.json()));
    const data = await Promise.all(promises);

    const tickerStr = data.map(c=>`${c.symbol.replace("USDT","")} ${parseFloat(c.lastPrice).toLocaleString()} USD (${parseFloat(c.priceChangePercent).toFixed(2)}%)`).join(" • ");
    document.getElementById("tickerText").innerText = tickerStr;

    const analytics = data.map(c=>{
      return `<div><strong>${c.symbol.replace("USDT","")}</strong> | Price: ${parseFloat(c.lastPrice).toLocaleString()} USD | 24h Δ: ${parseFloat(c.priceChange).toFixed(2)} USD (${parseFloat(c.priceChangePercent).toFixed(2)}%) | High: ${parseFloat(c.highPrice).toLocaleString()} | Low: ${parseFloat(c.lowPrice).toLocaleString()} | Volume: ${parseFloat(c.volume).toLocaleString()} | Trades: ${c.count}</div>`;
    }).join("");

    const cryptoVol = Math.max(...data.map(c=>Math.abs(parseFloat(c.priceChangePercent)))).toFixed(2) + "%";
    const metalsVol = "0.5%"; 
    const fxVol = "0.3%";
    const fngRes = await fetch("https://api.alternative.me/fng/?limit=1");
    const fngData = await fngRes.json();
    const fngIndex = fngData.data[0].value;
    const fngText = fngData.data[0].value_classification;

    const now = new Date(); 
    const hours = now.getUTCHours();
    let session = "Unknown";
    if(hours>=0 && hours<9) session="Asia Session";
    else if(hours>=7 && hours<16) session="Europe Session";
    else if(hours>=13 && hours<22) session="US Session";

    document.getElementById("analytics").innerHTML = analytics + 
      `<div>- Волатильність: Crypto ${cryptoVol} / Metals ${metalsVol} / FX ${fxVol}</div>` +
      `<div>- Індекс страху та жадібності: ${fngIndex} (${fngText})</div>` +
      `<div>- Поточна сесія: ${session}</div>`;

    // Alerts без підложки
    const alertsContainer = document.getElementById("alerts");
    alertsContainer.innerHTML = "";
    data.forEach(c=>{
      const change = parseFloat(c.priceChangePercent);
      if(Math.abs(change)>5){
        const div = document.createElement("div");
        div.classList.add("alert");
        div.classList.add(change>0 ? "up" : "down");
        div.innerText = `${c.symbol.replace("USDT","")} ${change>0 ? '↑' : '↓'} ${change.toFixed(2)}%`;
        alertsContainer.appendChild(div);
        setTimeout(()=>{div.style.opacity=0; setTimeout(()=>div.remove(),1000)},10000);
      }
    });

    // ================= SYSTEM STATE =================
    const systemState = document.getElementById("systemState");
    if(fngText.includes("Extreme") || parseFloat(cryptoVol) > 10){
      systemState.innerText="Екстримальний страх"; systemState.className="systemIndicator extremeFear";
    } else if(fngText.includes("Fear")){
      systemState.innerText="Страх"; systemState.className="systemIndicator fear";
    } else if(fngText.includes("Greed")){
      systemState.innerText="Жадібність"; systemState.className="systemIndicator greed";
    } else {
      systemState.innerText="Норма"; systemState.className="systemIndicator normal";
    }

  }catch(err){
    console.log(err);
    document.getElementById("tickerText").innerText="Crypto data unavailable";
    document.getElementById("analytics").innerHTML = `
      <div>- Об’єм торгів за 24h: unavailable</div>
      <div>- % зміна за день: unavailable</div>
      <div>- Волатильність: unavailable</div>
      <div>- Індекс страху та жадібності: unavailable</div>
      <div>- Поточна сесія: unavailable</div>
    `;
    document.getElementById("alerts").innerText="Alerts unavailable";
    const systemState = document.getElementById("systemState");
    systemState.innerText="LOADING..."; 
    systemState.className="systemIndicator normal";
  }
}
loadCrypto(); setInterval(loadCrypto,30000);

// ================= LAST UPDATE =================
function updateTime(){document.getElementById("lastUpdate").innerText=new Date().toLocaleTimeString();}
updateTime(); setInterval(updateTime,60000);

// ================= TRADINGVIEW =================
const tv = [
  {id:"chartBTC", symbol:"BTCUSD"},
  {id:"chartETH", symbol:"ETHUSD"},
  {id:"chartSOL", symbol:"SOLUSD"},
  {id:"chartXRP", symbol:"XRPUSD"},
  {id:"chartLTC", symbol:"LTCUSD"},
  {id:"chartDASH", symbol:"DASHUSD"}
];
const script=document.createElement("script"); script.src="https://s3.tradingview.com/tv.js"; 
script.onload=()=>{tv.forEach(c=>{new TradingView.widget({container_id:c.id,autosize:true,symbol:c.symbol,interval:"60",timezone:"Europe/Kiev",theme:"dark",style:"1",locale:"en",hide_top_toolbar:true,hide_side_toolbar:true,allow_symbol_change:true});});};
document.body.appendChild(script);
</script>
</body>
</html>
