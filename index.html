<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBONARIUM • economy.signal</title>

<style>
* {margin:0; padding:0; box-sizing:border-box;}
html, body {width:100%; height:100%; background:#000; font-family:"Times New Roman", serif; color:#9fe7ff; overflow-x:hidden;}
canvas {position:fixed; inset:0; z-index:0;}
.wrapper {position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; padding:20px; gap:10px; text-align:center; line-height:1.2; font-size:12px;}
#header-gif {max-width:180px; border-radius:6px; background:linear-gradient(180deg, #000, #4b0082); padding:6px;}
#header-caption {font-size:10px; opacity:0.5; margin-bottom:10px;}
.section {width:90%; max-width:720px; margin:4px 0; display:flex; flex-wrap:wrap; justify-content:space-between;}
.section div {margin:2px 6px; font-size:12px; line-height:1.2;}
#ticker {width:100%; overflow:hidden; background:#1a001a; border-top:1px solid #111; border-bottom:1px solid #111; padding:4px 0; position:relative;}
#ticker span {display:inline-block; white-space:nowrap; padding-left:100%; animation: ticker 60s linear infinite; font-size:12px;}
@keyframes ticker {from{transform:translateX(0);} to{transform:translateX(-100%);}}
#analytics {width:90%; max-width:720px; text-align:left; font-size:11px; line-height:1.2; margin:10px 0; border-top:1px solid #111; border-bottom:1px solid #111; padding:6px 4px;}
.chart {width:92vw; max-width:720px; height:320px; margin:14px 0; border:1px solid #111;}
#footer {font-size:10px; opacity:0.4; margin:12px 0;}
@media(max-width:600px){.chart{height:240px;}}
</style>
</head>

<body>
<canvas id="stars"></canvas>

<div class="wrapper">
  <img src="1.gif" alt="header" id="header-gif">
  <div id="header-caption">lavanda audit monito lab live</div>

  <div id="ticker"><span id="tickerText">LOADING CRYPTO DATA...</span></div>

  <div class="section" id="fx"></div>
  <div class="section" id="metals"></div>

  <div id="analytics">
    <div id="volume24h">- Об’єм торгів за 24h: loading...</div>
    <div id="percentChange">- % зміна: loading...</div>
    <div id="volatility">- Волатильність (Crypto / Metals / FX): loading...</div>
    <div id="fearGreed">- Індекс страху та жадібності: loading...</div>
  </div>

  <div id="chartBTC" class="chart"></div>
  <div id="chartETH" class="chart"></div>
  <div id="chartSOL" class="chart"></div>
  <div id="chartXRP" class="chart"></div>
  <div id="chartLTC" class="chart"></div>
  <div id="chartDASH" class="chart"></div>

  <div id="footer">© IBONARIUM • last update: <span id="lastUpdate"></span></div>
</div>

<script>
// ================= STARS BACKGROUND =================
const s=document.getElementById("stars"); const ctx=s.getContext("2d");
let W,H,stars=[];
function resize(){W=s.width=innerWidth; H=s.height=innerHeight; stars=Array.from({length:160},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*W}));}
resize(); window.addEventListener("resize",resize);
function draw(){ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#9fe7ff"; stars.forEach(st=>{st.z-=0.2; if(st.z<=0) st.z=W; const k=128/st.z; const x=(st.x-W/2)*k+W/2; const y=(st.y-H/2)*k+H/2; if(x>0&&x<W&&y>0&&y<H){const size=(1-st.z/W)*2; ctx.fillRect(x,y,size,size);}}); requestAnimationFrame(draw);}
draw();

// ================= FX & Metals =================
function loadFX(){document.getElementById("fx").innerHTML='<div>UAH / USD 36.85</div><div>UAH / EUR 40.20</div><div>UAH / PLN 9.10</div><div>UAH / GBP 9.10</div>';}
function loadMetals(){document.getElementById("metals").innerHTML='<div>XAU 4300</div><div>XAG 73</div><div>XPT 2150</div><div>XPD 1620</div>';}
loadFX(); loadMetals();

// ================= CRYPTO TICKER (Binance) =================
async function loadCrypto(){
  try{
    const symbols = ["BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","LTCUSDT","DASHUSDT","ADAUSDT","BNBUSDT","DOTUSDT","DOGEUSDT","AVAXUSDT","MATICUSDT","LINKUSDT","TRXUSDT","XLMUSDT","UNIUSDT","ATOMUSDT","VETUSDT","FILUSDT","ICPUSDT"];
    const promises = symbols.map(sym => fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${sym}`).then(res=>res.json()));
    const data = await Promise.all(promises);

    const tickerStr = data.map(c=>`${c.symbol.replace("USDT","")} ${parseFloat(c.lastPrice).toLocaleString()} USD (${parseFloat(c.priceChangePercent).toFixed(2)}%)`).join(" • ");
    document.getElementById("tickerText").innerText = tickerStr;

    // Analytics
    document.getElementById("volume24h").innerText="- Об’єм торгів за 24h: " + data.map(c=>`${c.symbol.replace("USDT","")}:${parseFloat(c.volume).toLocaleString()}`).join(" | ");
    document.getElementById("percentChange").innerText="- % зміна за день: " + data.map(c=>`${c.symbol.replace("USDT","")}:${parseFloat(c.priceChangePercent).toFixed(2)}%`).join(" | ");
    const prices = data.map(c=>parseFloat(c.lastPrice));
    const vol = Math.max(...prices)-Math.min(...prices);
    document.getElementById("volatility").innerText="- Волатильність (Crypto / Metals / FX): " + vol.toFixed(2);

    // Fear & Greed
    const fgRes = await fetch("https://api.alternative.me/fng/?limit=1");
    const fgData = await fgRes.json();
    document.getElementById("fearGreed").innerText="- Індекс страху та жадібності: " + fgData.data[0].value + " (" + fgData.data[0].value_classification + ")";

  }catch(err){
    console.log(err);
    document.getElementById("tickerText").innerText="Crypto data unavailable";
    document.getElementById("volume24h").innerText="- Об’єм торгів за 24h: unavailable";
    document.getElementById("percentChange").innerText="- % зміна: unavailable";
    document.getElementById("volatility").innerText="- Волатильність: unavailable";
    document.getElementById("fearGreed").innerText="- Індекс страху та жадібності: unavailable";
  }
}
loadCrypto();
setInterval(loadCrypto,30000);

// ================= LAST UPDATE =================
function updateTime(){document.getElementById("lastUpdate").innerText=new Date().toLocaleTimeString();}
updateTime(); setInterval(updateTime,60000);

// ================= TRADINGVIEW =================
const tv = [
  {id:"chartBTC", symbol:"BTCUSD"},
  {id:"chartETH", symbol:"ETHUSD"},
  {id:"chartSOL", symbol:"SOLUSD"},
  {id:"chartXRP", symbol:"XRPUSD"},
  {id:"chartLTC", symbol:"LTCUSD"},
  {id:"chartDASH", symbol:"DASHUSD"}
];
const script=document.createElement("script"); script.src="https://s3.tradingview.com/tv.js"; 
script.onload=()=>{tv.forEach(c=>{new TradingView.widget({container_id:c.id,autosize:true,symbol:c.symbol,interval:"60",timezone:"Europe/Kiev",theme:"dark",style:"1",locale:"en",hide_top_toolbar:true,hide_side_toolbar:true,allow_symbol_change:true});});};
document.body.appendChild(script);
</script>
</body>
</html>
