<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECONOMIC SIGNAL</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap');

body {
  margin: 0;
  background: black;
  color: #cfd8dc;
  font-family: 'JetBrains Mono', monospace;
  overflow: hidden;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: -1;
}

.center {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.stack {
  text-align: center;
  font-size: 13px;
  line-height: 1.6;
}

.title {
  color: #90caf9;
  font-size: 11px;
  letter-spacing: 1px;
  margin: 14px 0 6px;
}

.sep {
  opacity: .3;
  margin: 6px 0;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="center">
  <div class="stack">
    <div id="fx">loading…</div>
    <div class="sep">────────────</div>
    <div id="metals">loading…</div>
    <div class="sep">────────────</div>
    <div id="crypto">loading…</div>
  </div>
</div>

<script>
/* ===== STARFIELD ===== */
const c = document.getElementById('stars');
const x = c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight;}
resize(); onresize=resize;
const stars=[...Array(140)].map(()=>({x:Math.random()*c.width,y:Math.random()*c.height,z:Math.random()*2}));
(function draw(){
  x.clearRect(0,0,c.width,c.height);
  stars.forEach(s=>{
    s.y+=s.z;
    if(s.y>c.height) s.y=0;
    x.globalAlpha=s.z/2;
    x.fillStyle='white';
    x.fillRect(s.x,s.y,1,1);
  });
  requestAnimationFrame(draw);
})();

/* ===== NBU (ВАЛЮТИ + МЕТАЛИ) ===== */
async function loadNBU(){
  const r = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json');
  const d = await r.json();

  fx.innerHTML = '<div class="title">ВАЛЮТИ → UAH</div>';
  metals.innerHTML = '<div class="title">МЕТАЛИ · USD</div>';

  d.forEach(i=>{
    if(['USD','EUR','GBP','PLN'].includes(i.cc)){
      fx.innerHTML += `<div>${i.cc} ${i.rate.toFixed(2)}</div>`;
    }
    if(['XAU','XAG','XPT','XPD'].includes(i.cc)){
      metals.innerHTML += `<div>${i.cc} ${i.rate.toFixed(2)}</div>`;
    }
  });
}

/* ===== CRYPTO (COINCAP) ===== */
async function loadCrypto(){
  crypto.innerHTML = '<div class="title">КРИПТО · USD</div>';
  try {
    const r = await fetch(
      'https://api.coincap.io/v2/assets?ids=bitcoin,ethereum,solana,litecoin,xrp,dash'
    );
    const d = await r.json();

    d.data.forEach(c=>{
      crypto.innerHTML += `<div>${c.symbol} ${Number(c.priceUsd).toFixed(2)}</div>`;
    });

  } catch {
    crypto.innerHTML += '<div>NO SIGNAL</div>';
  }
}

/* ===== INIT ===== */
loadNBU();
loadCrypto();

setInterval(loadCrypto, 60000);
</script>

</body>
</html>
