<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECONOMIC SIGNAL</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap');

body {
  margin: 0;
  background: black;
  color: #cfd8dc;
  font-family: 'JetBrains Mono', monospace;
  overflow: hidden;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: -1;
}

/* ===== ЦЕНТР ===== */
.center {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, auto);
  gap: 26px 40px;
  text-align: center;
}

.block h3 {
  font-size: 11px;
  letter-spacing: 1px;
  color: #90caf9;
  margin-bottom: 6px;
}

.item {
  font-size: 13px;
  margin: 3px 0;
  white-space: nowrap;
  opacity: .9;
}
.dim { opacity: .4; }
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="center">
  <div class="grid">

    <div class="block">
      <h3>ВАЛЮТИ · UAH</h3>
      <div id="fx" class="dim">loading…</div>
    </div>

    <div class="block">
      <h3>МЕТАЛИ · UAH</h3>
      <div id="metals" class="dim">loading…</div>
    </div>

    <div class="block">
      <h3>КРИПТО · USD</h3>
      <div id="crypto" class="dim">connecting…</div>
    </div>

  </div>
</div>

<script>
/* ===== STARFIELD ===== */
const c = document.getElementById('stars');
const x = c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight;}
resize(); onresize=resize;
const stars=[...Array(150)].map(()=>({x:Math.random()*c.width,y:Math.random()*c.height,z:Math.random()*2}));
(function draw(){
  x.clearRect(0,0,c.width,c.height);
  stars.forEach(s=>{
    s.y+=s.z;
    if(s.y>c.height) s.y=0;
    x.globalAlpha=s.z/2;
    x.fillStyle='white';
    x.fillRect(s.x,s.y,1,1);
  });
  requestAnimationFrame(draw);
})();

/* ===== NBU ===== */
async function loadNBU(){
  const r = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json');
  const d = await r.json();

  fx.innerHTML='';
  metals.innerHTML='';

  d.forEach(i=>{
    if(['USD','EUR','GBP','PLN'].includes(i.cc))
      fx.innerHTML += `<div class="item">${i.cc} ${i.rate.toFixed(2)}</div>`;

    if(['XAU','XAG','XPT','XPD'].includes(i.cc))
      metals.innerHTML += `<div class="item">${i.cc} ${i.rate.toFixed(2)}</div>`;
  });

  fx.classList.remove('dim');
  metals.classList.remove('dim');
}

/* ===== CRYPTO (НЕ БЛОКУЄ) ===== */
async function loadCrypto(){
  crypto.innerHTML = '<div class="item dim">fetching market…</div>';

  try {
    const r = await fetch(
      'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,litecoin,ripple,dash&vs_currencies=usd'
    );
    const d = await r.json();

    crypto.innerHTML = `
      <div class="item">BTC ${d.bitcoin.usd}</div>
      <div class="item">ETH ${d.ethereum.usd}</div>
      <div class="item">SOL ${d.solana.usd}</div>
      <div class="item">LTC ${d.litecoin.usd}</div>
      <div class="item">XRP ${d.ripple.usd}</div>
      <div class="item">DASH ${d.dash.usd}</div>
    `;
    crypto.classList.remove('dim');

  } catch {
    crypto.innerHTML = '<div class="item dim">no signal</div>';
  }
}

/* ===== INIT ===== */
loadNBU();
loadCrypto();

setInterval(loadCrypto, 60000);
</script>

</body>
</html>
